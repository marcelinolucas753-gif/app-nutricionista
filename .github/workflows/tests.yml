name: Pruebas automáticas

# Corre las pruebas en cada cambio que se sube a main y en cada pull request.
# Si algo se rompe, GitHub muestra una cruz roja en el repositorio.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Una base PostgreSQL vacía y descartable solo para las pruebas de las rutas del servidor.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # La app solo depende de "pg". Las pruebas usan la base descartable de arriba, nunca la real.
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm test
